<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 420" width="440" height="420" role="img" aria-label="Over-ear noise-cancelling headphones">
  <defs>
    <!-- Front cup: form shading from top-left key light to lower-right falloff -->
    <linearGradient id="cupFront" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#5c5c69"/>
      <stop offset="0.28" stop-color="#3a3a45"/>
      <stop offset="0.68" stop-color="#22222a"/>
      <stop offset="1" stop-color="#131318"/>
    </linearGradient>
    <linearGradient id="cupBack" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#33333d"/>
      <stop offset="1" stop-color="#101015"/>
    </linearGradient>
    <linearGradient id="bandGrad" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#54545f"/>
      <stop offset="0.4" stop-color="#33333c"/>
      <stop offset="1" stop-color="#1a1a20"/>
    </linearGradient>
    <linearGradient id="metalRing" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#b9b9c6"/>
      <stop offset="0.35" stop-color="#6e6e7c"/>
      <stop offset="0.6" stop-color="#43434f"/>
      <stop offset="1" stop-color="#8a8a99"/>
    </linearGradient>
    <radialGradient id="padGrad" cx="0.44" cy="0.34" r="0.78">
      <stop offset="0" stop-color="#3b3b46"/>
      <stop offset="0.55" stop-color="#1e1e26"/>
      <stop offset="1" stop-color="#0a0a0e"/>
    </radialGradient>
    <radialGradient id="cavity" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#15151b"/>
      <stop offset="1" stop-color="#050508"/>
    </radialGradient>
    <linearGradient id="specular" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Rim light picks up the violet stage the product sits on -->
    <linearGradient id="rim" x1="1" y1="0.2" x2="0.3" y2="1">
      <stop offset="0" stop-color="#a08fff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#a08fff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#a08fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="floorShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.34"/>
      <stop offset="0.65" stop-color="#000000" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="220" cy="384" rx="132" ry="17" fill="url(#floorShadow)"/>

  <!-- REAR EARCUP — smaller and desaturated so it sits behind -->
  <g>
    <path d="M312 168 q6 34 4 62" stroke="url(#bandGrad)" stroke-width="15" stroke-linecap="round" fill="none"/>
    <ellipse cx="318" cy="258" rx="42" ry="55" fill="url(#cupBack)"/>
    <ellipse cx="318" cy="258" rx="42" ry="55" fill="none" stroke="#0a0a0e" stroke-width="1.5"/>
    <ellipse cx="318" cy="258" rx="42" ry="55" fill="none" stroke="url(#rim)" stroke-width="2.5"/>
  </g>

  <!-- HEADBAND -->
  <path d="M112 244 C112 122 158 62 220 62 C282 62 328 122 328 244"
        fill="none" stroke="url(#bandGrad)" stroke-width="30" stroke-linecap="round"/>
  <!-- inner padding channel -->
  <path d="M120 236 C120 134 162 80 220 80 C278 80 320 134 320 236"
        fill="none" stroke="#0c0c11" stroke-width="9" stroke-linecap="round" opacity="0.5"/>
  <!-- key-light highlight along the band's upper edge -->
  <path d="M126 218 C130 132 168 88 220 86"
        fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.22"/>
  <!-- violet rim on the band's outer right -->
  <path d="M300 140 C320 172 328 206 328 240"
        fill="none" stroke="#a08fff" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>

  <!-- LEFT YOKE / SLIDER -->
  <rect x="104" y="158" width="19" height="84" rx="9.5" fill="url(#bandGrad)"/>
  <rect x="109" y="168" width="3.5" height="62" rx="1.75" fill="#ffffff" opacity="0.14"/>
  <rect x="104" y="212" width="19" height="2" fill="#0a0a0e" opacity="0.6"/>

  <!-- FRONT EARCUP -->
  <g>
    <ellipse cx="120" cy="272" rx="66" ry="80" fill="url(#cupFront)"/>
    <ellipse cx="120" cy="272" rx="66" ry="80" fill="none" stroke="#08080c" stroke-width="1.5"/>
    <!-- brushed metal ring -->
    <ellipse cx="120" cy="272" rx="55" ry="68" fill="none" stroke="url(#metalRing)" stroke-width="3.5"/>
    <!-- memory-foam pad -->
    <ellipse cx="120" cy="272" rx="48" ry="60" fill="url(#padGrad)"/>
    <!-- pad seam -->
    <ellipse cx="120" cy="272" rx="38" ry="49" fill="none" stroke="#000000" stroke-width="1" opacity="0.5"/>
    <!-- inner cavity -->
    <ellipse cx="120" cy="272" rx="33" ry="43" fill="url(#cavity)"/>
    <!-- speaker mesh -->
    <ellipse cx="120" cy="272" rx="24" ry="32" fill="none" stroke="#2c2c36" stroke-width="0.8" opacity="0.7"/>
    <ellipse cx="120" cy="272" rx="15" ry="20" fill="none" stroke="#2c2c36" stroke-width="0.8" opacity="0.5"/>
    <!-- specular sweep, upper-left -->
    <ellipse cx="98" cy="238" rx="36" ry="44" fill="url(#specular)"/>
    <!-- violet rim light, lower-right edge -->
    <path d="M172 250 a66 80 0 0 1 -38 100" fill="none" stroke="url(#rim)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- physical controls -->
    <rect x="60" y="300" width="18" height="5" rx="2.5" fill="#0b0b10"/>
    <rect x="62" y="316" width="14" height="5" rx="2.5" fill="#0b0b10"/>
    <circle cx="158" cy="322" r="4.5" fill="#0b0b10"/>
  </g>
</svg>
