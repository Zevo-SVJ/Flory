<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" role="img" aria-label="Online course product">
  <defs>
    <linearGradient id="cScreen" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2a2540"/>
      <stop offset="1" stop-color="#15121f"/>
    </linearGradient>
    <linearGradient id="cBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8d5cd"/>
      <stop offset="1" stop-color="#a5a29a"/>
    </linearGradient>
    <radialGradient id="cShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#12121a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#12121a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="210" cy="356" rx="150" ry="16" fill="url(#cShadow)"/>

  <!-- laptop base -->
  <path d="M52 330 h316 l22 20 H30 Z" fill="url(#cBody)"/>
  <rect x="150" y="334" width="120" height="5" rx="2.5" fill="#8d8a82"/>

  <!-- screen -->
  <rect x="66" y="86" width="288" height="244" rx="10" fill="#c9c6be"/>
  <rect x="76" y="96" width="268" height="224" rx="5" fill="url(#cScreen)"/>

  <!-- video player -->
  <rect x="92" y="112" width="236" height="120" rx="5" fill="#0d0b16"/>
  <circle cx="210" cy="172" r="24" fill="#5b3df5"/>
  <path d="M203 162 l17 10 l-17 10 Z" fill="#ffffff"/>
  <rect x="100" y="216" width="150" height="4" rx="2" fill="#5b3df5"/>
  <rect x="250" y="216" width="70" height="4" rx="2" fill="#3a3550"/>

  <!-- module list -->
  <rect x="92" y="244" width="120" height="7" rx="3.5" fill="#3f3a58"/>
  <rect x="92" y="260" width="180" height="7" rx="3.5" fill="#2f2b44"/>
  <rect x="92" y="276" width="150" height="7" rx="3.5" fill="#2f2b44"/>
  <rect x="92" y="292" width="196" height="7" rx="3.5" fill="#2f2b44"/>
</svg>
